syntax = "proto3";
package vectorforge;

option java_package = "com.vectorforge.api.grpc";
option java_outer_classname = "VectorForgeProto";

service VectorForge {
    rpc Upsert (UpsertRequest) returns (UpsertResponse);
    rpc Query (QueryRequest) returns (QueryResponse);
}

message UpsertRequest {
    string collection = 1;
    string vector_id = 2;
    repeated float vector = 3;
    bytes metadata = 4;
}

message UpsertResponse {
    bool success = 1;
}

message QueryRequest {
    string collection = 1;
    repeated float vector = 2;
    int32 top_k = 3;
    int32 ef_search = 4;
}

message QueryResponse {
    repeated SearchResult results = 1;
}

message SearchResult {
    string vector_id = 1;
    float distance = 2;
}
